<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>History and Heritage Club – UAP</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--g:#e9b53a;--g1:#fff0b8;--g2:#a8710c;--bg:#0a0705;--t:#eadfc6;--foil:linear-gradient(135deg,#fff0b8,#e9b53a 35%,#a8710c 60%,#f6d67a)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'IM Fell English',Georgia,serif;font-size:17px;color:var(--t);background:var(--bg);overflow-x:hidden;
background:linear-gradient(#120905,#1c0e06 50%,#0a0705) fixed}
h1,h2,h3,.cz{font-family:'Cinzel Decorative','Cinzel',serif}
.foil{background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent}
@media(hover:hover){body,a,.act,.fr,.cap,button,.th{cursor:none}}
#cur,#dot{position:fixed;top:0;left:0;pointer-events:none;z-index:999;border-radius:50%}
#cur{width:38px;height:38px;border:1px solid var(--g);margin:-19px 0 0 -19px;transition:width .25s,height .25s,margin .25s,background .25s}
#cur.h{width:64px;height:64px;margin:-32px 0 0 -32px;background:rgba(233,181,58,.15)}
#dot{width:7px;height:7px;margin:-3px 0 0 -3px;background:var(--g)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:998}
@media(hover:none){#cur,#dot{display:none}}

/* top: auto scrolling activity strip */
.top{padding-top:74px;background:#000;border-bottom:3px double var(--g)}
.top .lbl{text-align:center;font-family:'Cinzel';letter-spacing:6px;font-size:12px;color:var(--g);padding:10px}
.marq{overflow:hidden;padding:6px 0 16px}
.track{display:flex;gap:26px;width:max-content;animation:sc 90s linear infinite}
.marq:hover .track{animation-play-state:paused}
@keyframes sc{to{transform:translateX(-50%)}}
.slide{width:290px;flex:none;text-align:center}
.slide .fr{height:190px}
.cap{margin:-2px auto 0;width:92%;padding:9px 8px;background:linear-gradient(#1c1306,#0d0904);border:1px solid var(--g);outline:1px solid rgba(233,181,58,.35);outline-offset:3px;font-family:'Cinzel';font-size:13px;letter-spacing:2px;color:var(--g1);position:relative;z-index:2}
.cap small{display:block;font-family:'IM Fell English';font-style:italic;color:#b9a77c;letter-spacing:1px;font-size:12px;margin-top:2px}

header{position:fixed;inset:0 0 auto 0;z-index:50;height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 4%;background:linear-gradient(#000,rgba(0,0,0,.88));border-bottom:1px solid var(--g);box-shadow:0 2px 0 #000,0 3px 0 rgba(233,181,58,.4)}
header img{height:54px;border-radius:50%;border:2px solid var(--g);background:#fff}
header .nm{font-family:'Cinzel Decorative';font-size:clamp(11px,2vw,19px);letter-spacing:2px;text-align:center;line-height:1.2}
nav{display:flex;gap:18px;position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);background:#000;padding:5px 26px;border:1px solid var(--g);clip-path:polygon(0 0,100% 0,95% 100%,5% 100%)}
nav a{color:var(--t);text-decoration:none;font-family:'Cinzel';font-size:11px;letter-spacing:2px;text-transform:uppercase;transition:.3s}
nav a:hover{color:var(--g);text-shadow:0 0 10px var(--g)}
@media(max-width:700px){nav{gap:9px;padding:5px 14px}nav a{font-size:9px}}

/* hero */
.hero{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 6% 50px;position:relative;overflow:hidden}
.mand{position:absolute;left:50%;top:44%;width:0;height:0}
.mand i{position:absolute;border-radius:50%;border:1px dashed rgba(233,181,58,.35);transform:translate(-50%,-50%)}
.mand i:nth-child(1){width:360px;height:360px;animation:rot 40s linear infinite}
.mand i:nth-child(2){width:480px;height:480px;border-style:dotted;animation:rot 60s linear infinite reverse}
.mand i:nth-child(3){width:620px;height:620px;border:1px solid rgba(233,181,58,.15);animation:rot 90s linear infinite}
.mand i:nth-child(4){width:760px;height:760px;border-style:dashed;border-color:rgba(233,181,58,.1);animation:rot 120s linear infinite reverse}
@keyframes rot{to{transform:translate(-50%,-50%) rotate(360deg)}}
.logoW{position:relative;transition:transform .15s}
.logoW img{width:min(240px,52vw);display:block;border-radius:6px;border:3px double var(--g);padding:6px;background:#000;box-shadow:0 0 60px rgba(233,181,58,.35),inset 0 0 20px rgba(233,181,58,.3);animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px) rotate(1deg)}}
.hero h1{font-size:clamp(28px,6vw,64px);margin-top:34px;letter-spacing:3px;line-height:1.1;position:relative}
.hero p{font-style:italic;font-size:clamp(17px,2.4vw,24px);margin-top:14px;color:#cdbb92;position:relative}
.typ:after{content:"|";animation:bl 1s steps(1) infinite;color:var(--g)}
@keyframes bl{50%{opacity:0}}
.btn{display:inline-block;margin-top:30px;padding:13px 38px;color:var(--g);text-decoration:none;font-family:'Cinzel';letter-spacing:4px;font-size:12px;border:1px solid var(--g);outline:1px solid rgba(233,181,58,.4);outline-offset:4px;position:relative;overflow:hidden;transition:.4s}
.btn:hover{background:var(--g);color:#000}

section{padding:70px 5%;position:relative}
.st{text-align:center;margin-bottom:46px}
.st h2{font-size:clamp(22px,4vw,38px);letter-spacing:5px;text-transform:uppercase}
.div{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--g);margin-top:12px;font-size:20px}
.div:before,.div:after{content:"";height:2px;width:min(120px,22vw);border-top:1px solid var(--g);border-bottom:1px solid var(--g);height:5px}
.rv{opacity:0;transform:translateY(50px) scale(.96);transition:1s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:34px 28px;max-width:1150px;margin:auto}
.grid.c{grid-template-columns:repeat(auto-fit,minmax(230px,260px));justify-content:center}

/* antique gold frame */
.fr{position:relative;padding:10px;background:var(--foil);box-shadow:0 8px 24px rgba(0,0,0,.7);}
.fr:before{content:"";position:absolute;inset:3px;border:1px solid #5a3a05;pointer-events:none;z-index:3}
.fr:after{content:"";position:absolute;inset:10px;border:2px solid #2a1a02;box-shadow:inset 0 0 14px #000;pointer-events:none;z-index:3}
.fr .in{position:relative;height:100%;background:#120c04;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--g);font-family:'Cinzel Decorative';font-size:42px}
.fr img{width:100%;height:100%;object-fit:cover;filter:sepia(.55) contrast(1.05);transition:.7s}
.fr:hover img{filter:none;transform:scale(1.08)}
.co{position:absolute;z-index:4;color:#2a1a02;font-size:16px;line-height:1;text-shadow:0 1px 0 #fff0b8}
.co.a{top:-1px;left:2px}.co.b{top:-1px;right:2px}.co.c{bottom:-1px;left:2px}.co.d{bottom:-1px;right:2px}

.card{transform-style:preserve-3d;transition:transform .2s;perspective:700px;position:relative}
.card .fr{aspect-ratio:1/1.18}
.card .shine{position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,240,184,.35),transparent 45%);opacity:0;transition:.3s;mix-blend-mode:overlay}
.card:hover .shine{opacity:1}
.plate{margin:-14px 8px 0;position:relative;z-index:6;text-align:center;padding:10px 14px 12px;background:linear-gradient(#1f1507,#0c0803);border:1px solid var(--g);outline:1px solid rgba(233,181,58,.3);outline-offset:3px;clip-path:polygon(0 0,100% 0,100% 100%,50% 88%,0 100%)}
.plate b{display:block;font-weight:400;font-size:19px;color:var(--g1);line-height:1.15}
.pos{font-family:'Cinzel';font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--g);margin-top:4px;padding-bottom:8px}
.dep{font-style:italic;font-size:13px;color:#b9a77c}

.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:40px;max-width:1100px;margin:auto}
.act .fr{height:360px}
.act .ov{position:absolute;left:0;right:0;bottom:0;padding:70px 22px 22px;background:linear-gradient(transparent,rgba(0,0,0,.93));z-index:2;text-align:left}
.act h3{font-size:22px;color:var(--g);letter-spacing:2px}
.act p{font-style:italic;margin:6px 0 10px;color:#ddd}
.act span{font-family:'Cinzel';font-size:11px;letter-spacing:3px;border-bottom:1px solid var(--g);padding-bottom:2px}

#lb{position:fixed;inset:0;background:rgba(5,3,1,.97);z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#lb.on{display:flex}
#lb h3{color:var(--g);letter-spacing:4px;margin-bottom:12px;text-align:center;font-size:20px}
#main{max-width:90vw;max-height:60vh;min-width:260px;min-height:200px;padding:10px;background:var(--foil);box-shadow:0 0 60px rgba(233,181,58,.25)}
#main div{background:#120c04;min-height:180px;display:flex;align-items:center;justify-content:center;color:var(--g);font-family:'Cinzel';padding:20px;border:2px solid #2a1a02}
#main img{max-width:88vw;max-height:56vh;display:block;border:2px solid #2a1a02}
#th{display:flex;gap:8px;margin-top:16px;max-width:92vw;overflow-x:auto;padding:6px}
.th{flex:0 0 66px;height:50px;border:2px solid #444;opacity:.5;background:#1a1307 center/cover}
.th.a{opacity:1;border-color:var(--g)}
.ct{margin-top:8px;font-family:'Cinzel';font-size:12px;letter-spacing:3px;color:#aaa}
.nb{position:absolute;top:50%;background:#000;border:1px solid var(--g);color:var(--g);width:48px;height:48px;font-size:22px;transform:rotate(45deg)}
.nb span{display:block;transform:rotate(-45deg)}
#pv{left:14px}#nx{right:14px}#cl{top:16px;right:16px}

footer{text-align:center;padding:44px 6%;border-top:3px double var(--g);background:#000;color:#9a8a66;font-family:'Cinzel';font-size:11px;letter-spacing:3px}
footer img{height:60px;background:#fff;border-radius:6px;margin-bottom:14px}

/* Bangladeshi heritage backdrop */
.symdefs{position:absolute;width:0;height:0}
.fixsky{position:fixed;left:0;right:0;bottom:0;height:260px;z-index:0;pointer-events:none;color:#d98a3a;opacity:.11}
.fixsky svg,.skyL svg{width:100%;height:100%;display:block}
body>section,body>footer,.top{position:relative;z-index:2}
.hero{background:linear-gradient(#1a0c05 0%,#4a210a 45%,#a8581a 78%,#e0953a 100%);padding-bottom:230px}
.sun{position:absolute;left:50%;bottom:150px;width:340px;height:340px;margin-left:-170px;border-radius:50%;background:radial-gradient(circle,#ffe39a 0,#f4b04a 28%,rgba(244,176,74,.25) 55%,transparent 70%);filter:blur(1px)}
.skyL{position:absolute;left:-3%;right:-3%;bottom:0;height:280px;pointer-events:none}
.skyL.far{color:#7a3a14;opacity:.75;bottom:22px;transform-origin:bottom}
.skyL.near{color:#0b0604}
.birds{position:absolute;inset:0;pointer-events:none}
.birds svg{position:absolute;width:26px;fill:none;stroke:#2a1204;stroke-width:2;animation:fly 26s linear infinite}
.birds svg:nth-child(2){top:22%;animation-duration:34s;animation-delay:-12s;width:20px}
.birds svg:nth-child(3){top:30%;animation-duration:30s;animation-delay:-20s;width:16px}
.birds svg:nth-child(1){top:16%}
@keyframes fly{from{left:-5%}to{left:105%}}
.brick{height:20px;margin:0;background:
linear-gradient(90deg,transparent 29px,#2a0f04 29px 31px,transparent 31px) 0 0/60px 10px,
linear-gradient(90deg,transparent 29px,#2a0f04 29px 31px,transparent 31px) 30px 10px/60px 10px,
linear-gradient(#2a0f04 1px,transparent 1px) 0 0/60px 10px,#8a3d1a;
border-block:2px solid var(--g);box-shadow:0 0 18px rgba(0,0,0,.6);position:relative;z-index:2}
.brick:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 118px,rgba(233,181,58,.55) 118px 120px)}
footer{position:relative;z-index:2}
.fskyW{position:relative;height:110px;background:linear-gradient(#0a0705,#a8581a);z-index:2}
.fskyW .skyL{height:110px;color:#000;bottom:0}
</style></head><body>

<div class="fixsky"><svg><use href="#sk"/></svg></div>

<header>
<img src="logos/club.jpg" alt="H&H">
<div class="nm foil">History &amp; Heritage Club<br><span style="font-size:.6em;letter-spacing:4px">University of Asia Pacific</span></div>

<div class="brick"></div>

<div class="brick"></div>

<div id="lb"><button class="nb" id="cl"><span>✕</span></button><h3 id="lt"></h3><div id="main"></div><div class="ct" id="ct"></div><div id="th"></div><button class="nb" id="pv"><span>‹</span></button><button class="nb" id="nx"><span>›</span></button></div>

<script>
/* PHOTOS in "pics" folder: 1 Adviser · 2 President · 3 General Secretary · 4-10 Executive Members · 11-25 Sub-Executives
   Activities: t1–t5 = Comilla Historical Tour · k1–k10 = Know Thyself   (jpg / jpeg / png) */
const adviser=[{n:1,name:"Farhana Akter Akhi",pos:"Adviser",dep:"Department of Human Science"}];
const exe=[["Zabiduzzaman Srabon","President"],["Srejon Paul","General Secretary"],["Umme Honey","Executive Member-1"],["Sanjida Shopna Moon","Executive Member-2"],["Marzia Akter Borsha","Executive Member-3"],["Nafiz Yeasin Swajan","Executive Member-4"],["Umme Sabiba Samanta","Executive Member-5"],["Abidur Roshid Abid","Executive Member-6"],["Mohammad Akib Shahariyar Babu","Executive Member-7"]].map((x,i)=>({n:i+2,name:x[0],pos:x[1]}));
const sub=[["Boishakhi Sutradhar Mim","English"],["Md Ashrafuzzaman Akash","EEE"],["Jakia Sultana Prity","English"],["Umiya Akter Roza","BBA"],["MH Nazmul Islam Araf","CIVIL"],["Atanu Saha","EEE"],["Fahimunnesa Chowdhury","L&HR"],["Aryan Al Araf","L&HR"],["Anisa Anjum","English"],["Rashid Muhammad Naziat","EEE"],["Gazi Toufiq","CSE"],["Ahmed Shahriar Sanket","CIVIL"],["Sharika Tahmeed Kawkab","English"],["Samia Islam Nova","English"],["Taseen Choudhury","L&HR"]].map((x,i)=>({n:i+11,name:x[0],pos:"Sub-Executive",dep:x[1]}));
const acts=[{t:"Comilla Historical Tour",x:"A journey through the ancient heritage sites of Comilla.",p:"t",c:5},{t:"Know Thyself",x:"A reflective program to explore identity, roots and history.",p:"k",c:10}];
const $=id=>document.getElementById(id),ex=["jpg","jpeg","png","JPG","PNG"];
function load(b,cb,fail){let k=0;const im=new Image();const nx=()=>{if(k>=ex.length)return fail&&fail();im.src=b+"."+ex[k++]};im.onload=()=>cb(im.src);im.onerror=nx;nx()}
function frame(base,label,style){const f=document.createElement("div");f.className="fr";if(style)f.style.cssText=style;
 f.innerHTML='<div class="in">'+label[0]+'</div><i class="co a">❦</i><i class="co b">❦</i><i class="co c">❦</i><i class="co d">❦</i>';
 load(base,s=>{const im=new Image();im.src=s;const d=f.firstChild;d.textContent="";d.appendChild(im)});return f}
function card(m){const c=document.createElement("div");c.className="card rv";c.appendChild(frame("pics/"+m.n,m.name));
 c.insertAdjacentHTML("beforeend",`<div class="shine"></div><div class="plate"><b>${m.name}</b><div class="pos">${m.pos}</div>${m.dep?`<div class="dep">${m.dep}</div>`:""}</div>`);return c}
[["advG",adviser],["exeG",exe],["subG",sub]].forEach(([id,l])=>l.forEach(m=>$(id).appendChild(card(m))));

/* top strip: every activity photo with title box */
const strip=[];acts.forEach(a=>{for(let i=1;i<=a.c;i++)strip.push({a,i})});
[0,1].forEach(()=>strip.forEach(({a,i})=>{const s=document.createElement("div");s.className="slide";s.appendChild(frame("pics/"+a.p+i,a.t));
 s.insertAdjacentHTML("beforeend",`<div class="cap">${a.t}<small>Photo ${i} of ${a.c}</small></div>`);s.onclick=()=>openLB(a,i-1);$("track").appendChild(s)}));

/* activity cards + lightbox */
let cur,idx;
acts.forEach(a=>{const d=document.createElement("div");d.className="act rv";const f=frame("pics/"+a.p+"1",a.t);
 f.querySelector(".in").insertAdjacentHTML("beforeend",`<div class="ov"><h3>${a.t}</h3><p>${a.x}</p><span>VIEW ${a.c} PHOTOS</span></div>`);
 d.appendChild(f);d.onclick=()=>openLB(a,0);$("actG").appendChild(d)});
function openLB(a,i){cur=a;$("lt").textContent=a.t;$("th").innerHTML="";
 for(let j=1;j<=a.c;j++){const t=document.createElement("div");t.className="th";t.onclick=()=>show(j-1);$("th").appendChild(t);load("pics/"+a.p+j,s=>t.style.backgroundImage=`url(${s})`)}
 $("lb").classList.add("on");show(i)}
function show(i){idx=(i+cur.c)%cur.c;const m=$("main");m.innerHTML=`<div>Add pics/${cur.p}${idx+1}.jpg</div>`;
 load("pics/"+cur.p+(idx+1),s=>{m.innerHTML=`<img src="${s}">`});$("ct").textContent=(idx+1)+" / "+cur.c;
 [...$("th").children].forEach((t,j)=>t.classList.toggle("a",j==idx))}
$("pv").onclick=()=>show(idx-1);$("nx").onclick=()=>show(idx+1);$("cl").onclick=()=>$("lb").classList.remove("on");
onkeydown=e=>{if(!$("lb").classList.contains("on"))return;if(e.key=="ArrowRight")show(idx+1);if(e.key=="ArrowLeft")show(idx-1);if(e.key=="Escape")$("cl").onclick()};

/* scroll reveal (staggered) */
const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.style.transitionDelay=(x.target.dataset.d||0)+"ms";x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.08});
document.querySelectorAll(".grid,.acts").forEach(g=>[...g.children].forEach((c,i)=>c.dataset.d=(i%6)*90));
document.querySelectorAll(".rv").forEach(e=>io.observe(e));

/* typing line */
const msg="Preserving the past, inspiring the future",ty=$("typ");let ti=0;(function t(){ty.firstChild&&0;ty.textContent=msg.slice(0,ti);ty.className="typ";if(ti++<=msg.length)setTimeout(t,60)})();

/* mouse: cursor, sparkles, parallax, tilt */
const cur_=$("cur"),dot=$("dot"),cv=$("fx"),cx=cv.getContext("2d");let W,H,P=[],mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();onresize=rs;
onmousemove=e=>{mx=e.clientX;my=e.clientY;dot.style.transform=`translate(${mx}px,${my}px)`;
 for(let i=0;i<2;i++)P.push({x:mx,y:my,vx:(Math.random()-.5)*1.4,vy:Math.random()*1.2+.2,l:1,s:Math.random()*2.5+1});
 const hr=$("hero").getBoundingClientRect();if(hr.bottom>0){const dx=(mx/W-.5),dy=(my/H-.5);
  $("logoW").style.transform=`translate(${dx*-30}px,${dy*-22}px)`;$("mand").style.transform=`translate(${dx*40}px,${dy*30}px)`;$("sun").style.transform=`translate(${dx*-26}px,${dy*-14}px)`;$("sfar").style.transform=`translateX(${dx*-14}px)`;$("snear").style.transform=`translateX(${dx*-34}px)`}};
document.addEventListener("mouseover",e=>cur_.classList.toggle("h",!!e.target.closest("a,.act,.slide,button,.th")));
(function loop(){rx+=(mx-rx)*.18;ry+=(my-ry)*.18;cur_.style.transform=`translate(${rx}px,${ry}px)`;
 cx.clearRect(0,0,W,H);P=P.filter(p=>p.l>0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.l-=.02;cx.globalAlpha=p.l;cx.fillStyle="#f6d67a";cx.shadowColor="#e9b53a";cx.shadowBlur=8;
  cx.save();cx.translate(p.x,p.y);cx.rotate(p.l*6);cx.fillRect(-p.s,-p.s,p.s*2,p.s*2);cx.restore()});requestAnimationFrame(loop)})();
document.addEventListener("mousemove",e=>{const c=e.target.closest(".card");if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
 c.style.transform=`perspective(700px) rotateY(${(x-.5)*16}deg) rotateX(${(.5-y)*16}deg) translateY(-6px)`;c.style.setProperty("--mx",x*100+"%");c.style.setProperty("--my",y*100+"%")});
document.addEventListener("mouseout",e=>{const c=e.target.closest&&e.target.closest(".card");if(c&&!c.contains(e.relatedTarget))c.style.transform=""});
</script></body></html>
